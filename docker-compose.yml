services:
  postgres:
    image: postgres:16-alpine
    container_name: mobilidade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobilidade
      POSTGRES_PASSWORD: mobilidade_dev
      POSTGRES_DB: mobilidade
    ports:
      - "5432:5432"
    volumes:
      - mobilidade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobilidade -d mobilidade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mobilidade_pgdata:
