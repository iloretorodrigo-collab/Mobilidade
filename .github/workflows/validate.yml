name: Validate Mobilidade

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobilidade
          POSTGRES_PASSWORD: mobilidade
          POSTGRES_DB: mobilidade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobilidade -d mobilidade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mobilidade:mobilidade@localhost:5432/mobilidade?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
      NODE_ENV: development
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: LocalAdminPassword123!
      API_URL: http://127.0.0.1:3333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run db:seed-admin
      - run: npm run typecheck
      - run: npm run typecheck:passenger
      - run: npm run typecheck:driver
      - run: npm run build:api
      - run: npm run build:passenger
      - run: npm run build:driver
      - uses: actions/upload-artifact@v4
        with:
          name: mobilidade-android-bundles
          path: |
            apps/passenger/dist/**
            apps/driver/dist/**
          if-no-files-found: error
          retention-days: 14
      - name: Start API
        run: |
          npm run dev:api > /tmp/mobilidade-api.log 2>&1 &
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:3333/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/mobilidade-api.log
          exit 1
      - run: npm run test:integration

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run Android emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            export EXPO_PUBLIC_API_URL=http://10.0.2.2:3333

            cd apps/passenger
            npx expo prebuild --platform android --no-install --non-interactive
            cd android
            ./gradlew assembleRelease
            adb install -r app/build/outputs/apk/release/app-release.apk
            cd ../../..

            maestro test .maestro/passenger-session.yaml

            cd apps/driver
            npx expo prebuild --platform android --no-install --non-interactive
            cd android
            ./gradlew assembleRelease
            adb install -r app/build/outputs/apk/release/app-release.apk
            cd ../../..

            maestro test .maestro/driver-session.yaml
