name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobilidade
          POSTGRES_PASSWORD: mobilidade_test
          POSTGRES_DB: mobilidade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobilidade -d mobilidade_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mobilidade:mobilidade_test@localhost:5432/mobilidade_test?schema=public
      JWT_SECRET: ci-integration-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate OpenAPI contract
        run: npm run lint:openapi
      - run: npm run db:generate
      - name: Prepare integration database
        run: npx prisma db push --schema=packages/database/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run build:api
      - name: Test quote, trip request, dispatch and WebSocket
        run: npm run test:integration --workspace @mobilidade/api
