openapi: 3.1.0
info:
  title: VIAÊ Mobility API
  version: 1.0.0
  description: |
    Contrato REST inicial da VIAÊ. Os endpoints de autenticação e perfil
    correspondem à API existente. Cotação e criação/consulta de corrida têm um MVP aproximado; Google Routes, despacho, WebSocket e pagamentos ainda precisam de implementação.
servers:
  - url: http://localhost:3333
    description: Desenvolvimento local (API atual)
  - url: https://api.viae.com.br
    description: Produção (domínio ilustrativo, confirmar antes do lançamento)
tags:
  - name: Health
  - name: Authentication
  - name: Profile
  - name: Places
  - name: Pricing
  - name: Trips
  - name: Drivers
  - name: Payments
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Verificar disponibilidade da API
      security: []
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [ok] }
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Criar conta de passageiro ou motorista
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: E-mail já cadastrado
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Autenticar com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      tags: [Profile]
      operationId: getCurrentUser
      summary: Consultar perfil autenticado
      responses:
        '200':
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      operationId: updateCurrentUser
      summary: Atualizar nome e/ou telefone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profiles/driver:
    patch:
      tags: [Drivers]
      operationId: updateDriverProfile
      summary: Atualizar dados de veículo e cadastro do motorista
      description: Motoristas permanecem pendentes até que a verificação administrativa seja implementada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileUpdateRequest'
      responses:
        '200':
          description: Perfil do motorista atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/places/autocomplete:
    get:
      tags: [Places]
      operationId: autocompletePlaces
      summary: Pesquisar endereços
      description: Implementado com Google Places API (New). A chave privada permanece exclusivamente no backend.
      parameters:
        - in: query
          name: input
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
        - in: query
          name: location
          required: false
          description: Viés geográfico opcional para Porto Alegre.
          schema: { $ref: '#/components/schemas/Coordinates' }
      responses:
        '200':
          description: Sugestões de endereço
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSuggestion' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Provedor de mapas indisponível
  /api/v1/routes/estimate:
    post:
      tags: [Places]
      operationId: estimateRoute
      summary: Estimar distância e duração de uma rota
      description: Implementado com Google Routes API. Distância e duração retornadas pelo provedor não garantem o tempo real de viagem.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        '200':
          description: Rota estimada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: Provedor de mapas indisponível
  /api/v1/quotes:
    post:
      tags: [Pricing]
      operationId: createQuote
      summary: Gerar estimativa de tarifa
      description: Usa Google Routes API quando GOOGLE_MAPS_API_KEY está configurada; sem chave, mantém fallback aproximado sem paradas intermediárias.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Cotação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Somente passageiros podem solicitar cotações
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          description: Não foi possível calcular a rota
  /api/v1/trips:
    post:
      tags: [Trips]
      operationId: requestTrip
      summary: Solicitar corrida
      description: MVP implementado com persistência e Idempotency-Key; despacho e atribuição de motorista ainda não estão implementados.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTripRequest' }
      responses:
        '200':
          description: Resultado original devolvido em repetição idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '201':
          description: Corrida solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflito de idempotência ou de estado
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/trips/{tripId}:
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Consultar corrida
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Estado atual da corrida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sem permissão para consultar esta corrida
        '404':
          description: Corrida não encontrada
  /api/v1/trips/{tripId}/cancel:
    post:
      tags: [Trips]
      operationId: cancelTrip
      summary: Cancelar corrida
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Cancelamento registrado
        '409':
          description: Corrida não pode ser cancelada neste estado
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/drivers/me/availability:
    put:
      tags: [Drivers]
      operationId: setDriverAvailability
      summary: Definir disponibilidade do motorista
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
      responses:
        '200':
          description: Disponibilidade atualizada
        '403':
          description: Motorista não aprovado
  /api/v1/trips/{tripId}/accept:
    post:
      tags: [Drivers]
      operationId: acceptTrip
      summary: Aceitar oferta de corrida
      description: Implementado com oferta persistida, expiração e atualização condicional atômica; somente um motorista pode vencer. O motorista deve estar aprovado e online.
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerId]
              properties:
                offerId: { type: string, minLength: 1 }
      responses:
        '200':
          description: Corrida atribuída ao motorista
        '409':
          description: Oferta expirada ou corrida já atribuída
        '403':
          description: Motorista não autorizado
  /api/v1/trips/{tripId}/start:
    post:
      tags: [Drivers]
      operationId: startTrip
      summary: Iniciar corrida
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Corrida iniciada
        '409':
          description: Transição de estado inválida
  /api/v1/trips/{tripId}/complete:
    post:
      tags: [Drivers]
      operationId: completeTrip
      summary: Finalizar corrida
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Corrida finalizada
        '409':
          description: Transição de estado inválida
  /api/v1/payments/webhooks/mercado-pago:
    post:
      tags: [Payments]
      operationId: mercadoPagoWebhook
      summary: Receber notificação de pagamento
      description: Planejado. Validar autenticidade conforme documentação oficial do Mercado Pago e consultar o recurso no provedor antes de alterar o estado interno.
      security: []
      responses:
        '200':
          description: Notificação recebida ou duplicada de forma segura
        '400':
          description: Notificação inválida
        '401':
          description: Assinatura inválida
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      in: path
      name: tripId
      required: true
      schema: { type: string,  }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Dados inválidos ou regra de negócio não atendida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Limite de requisições excedido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, 'null'], minLength: 8, maxLength: 20 }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
        role: { type: string, enum: [passenger, driver] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        tokenType: { type: string, examples: [Bearer] }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string,  }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        role: { type: string, enum: [passenger, driver, admin] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: [string, 'null'], minLength: 8, maxLength: 20 }
    DriverProfileUpdateRequest:
      type: object
      minProperties: 1
      properties:
        cpf: { type: string, minLength: 11, maxLength: 14, writeOnly: true }
        licenseNumber: { type: string, minLength: 5, maxLength: 30, writeOnly: true }
        vehicleMake: { type: string, minLength: 1, maxLength: 60 }
        vehicleModel: { type: string, minLength: 1, maxLength: 60 }
        vehicleColor: { type: string, minLength: 1, maxLength: 40 }
        vehiclePlate: { type: string, minLength: 7, maxLength: 10 }
    PlaceSuggestion:
      type: object
      required: [placeId, description]
      properties:
        placeId: { type: string }
        description: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
    RouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/Coordinates' }
        destination: { $ref: '#/components/schemas/Coordinates' }
        waypoints:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/Coordinates' }
    RouteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [distanceMeters, durationSeconds]
          properties:
            distanceMeters: { type: integer, minimum: 0 }
            durationSeconds: { type: integer, minimum: 0 }
            encodedPolyline: { type: string }
    QuoteRequest:
      allOf:
        - $ref: '#/components/schemas/RouteRequest'
        - type: object
          required: [category]
          properties:
            category: { type: string, enum: [standard] }
    QuoteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [quoteId, currency, estimatedDistanceMeters, estimatedDurationSeconds, estimatedFareCents, expiresAt]
          properties:
            quoteId: { type: string }
            currency: { type: string, const: BRL }
            estimatedDistanceMeters: { type: integer, minimum: 0 }
            estimatedDurationSeconds: { type: integer, minimum: 0 }
            estimatedFareCents: { type: integer, minimum: 0 }
            fareSource: { type: string, enum: [mvp_straight_line_approximation, google_routes] }
            fareBreakdown:
              type: object
              properties:
                baseFareCents: { type: integer, minimum: 0 }
                distanceFareCents: { type: integer, minimum: 0 }
                timeFareCents: { type: integer, minimum: 0 }
                feesCents: { type: integer, minimum: 0 }
                discountCents: { type: integer, minimum: 0 }
            expiresAt: { type: string, format: date-time }
    CreateTripRequest:
      type: object
      required: [quoteId]
      properties:
        quoteId: { type: string }
        paymentMethodId: { type: string }
        notes: { type: string, maxLength: 500 }
    TripResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [tripId, status]
          properties:
            tripId: { type: string }
            status:
              type: string
              enum: [requested, searching, accepted, driver_arrived, in_progress, completed, canceled]
            estimatedFareCents: { type: integer, minimum: 0 }
            currency: { type: string, const: BRL }
            createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        meta:
          type: object
          properties:
            requestId: { type: string }
